[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-guardrails"
version = "0.7.0"
description = "A transparent guardrails proxy for LLM tool-calling. Applies response validation, rescue parsing, and retry logic between clients and any backend endpoint."
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Antoine Zambelli"}]
readme = "README.md"
keywords = ["llm", "tool-calling", "agents", "guardrails", "proxy", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[project.urls]
Homepage = "https://github.com/isgallagher/forge-guardrails"
Repository = "https://github.com/isgallagher/forge-guardrails"
Documentation = "https://github.com/isgallagher/forge-guardrails/tree/main/docs"
Changelog = "https://github.com/isgallagher/forge-guardrails/blob/main/CHANGELOG.md"

[project.scripts]
forge-proxy = "forge.proxy.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "mpmath",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require a running LLM backend (deselect with '-m \"not integration\"')",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["forge"]

[tool.coverage.report]
omit = [
    # Integration-only: lifecycle orchestration requiring real backends/threads.
    # Covered by eval harness runs, not unit tests.
    "src/forge/proxy/proxy.py",
    "src/forge/proxy/__main__.py",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff rules
]
ignore = [
    "E501",   # line too long (ruff handles formatting)
    "SIM108", # use ternary instead of if-else
    "SIM105", # suppress is context-dependent (asyncio CancelledError)
    "UP042",  # StrEnum not available on 3.11
    "RUF001", # ambiguous chars (EN dash, etc. — intentional)
    "RUF002", # ambiguous chars (multiplication sign — intentional)
    "RUF022", # __all__ ordering — manual by category
    "E731",   # lambda assignment — legacy code
]

[tool.ruff.lint.isort]
known-first-party = ["forge"]
